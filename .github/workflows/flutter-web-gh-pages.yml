name: Build Flutter Web and Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        continue-on-error: true
        with:
          channel: stable
          cache: true

      - name: Ensure Flutter installed (fallback)
        run: |
          if command -v flutter >/dev/null 2>&1; then
            echo "Flutter already installed:" $(flutter --version)
          else
            echo "Flutter not found — installing fallback Flutter 3.10.7"
            FLUTTER_VERSION=3.10.7
            ARCHIVE=flutter_linux_${FLUTTER_VERSION}-stable.tar.xz
            URL="https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/$ARCHIVE"
            mkdir -p $HOME/flutter
            curl -fsSL -o /tmp/$ARCHIVE $URL
            tar -xJf /tmp/$ARCHIVE -C $HOME
            export PATH="$HOME/flutter/bin:$PATH"
            echo "Installed:" $(flutter --version || true)
          fi
        shell: bash

      - name: Install dependencies
        run: |
          cd mobile
          flutter pub get

      - name: Build Flutter web
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
        run: |
          cd mobile
          if [ -z "$API_BASE_URL" ]; then
            API_BASE_URL="https://smartspender-vd33.onrender.com"
            echo "API_BASE_URL not set — using fallback $API_BASE_URL"
          fi
          flutter build web --release --pwa-strategy=none --base-href /SmartSpender/ \
            --dart-define=APP_ENV=production \
            --dart-define=API_BASE_URL=${API_BASE_URL}

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          personal_token: ${{ secrets.GH_PAGES_PAT }}
          publish_branch: gh-pages
          publish_dir: ./mobile/build/web
