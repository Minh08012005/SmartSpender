name: Build Flutter Web and Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.10.7"

      - name: Upgrade Flutter to latest stable
        run: |
          cd mobile || exit 0
          flutter upgrade --force || true
          flutter --version

      - name: Install dependencies
        run: |
          cd mobile
          flutter pub get

      - name: Build Flutter web
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
        run: |
          cd mobile
          if [ -z "$API_BASE_URL" ]; then
            API_BASE_URL="https://smartspender-vd33.onrender.com"
            echo "API_BASE_URL not set — using fallback $API_BASE_URL"
          fi
          flutter build web --release --pwa-strategy=none \
            --dart-define=APP_ENV=production \
            --dart-define=API_BASE_URL=${API_BASE_URL}

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./mobile/build/web
