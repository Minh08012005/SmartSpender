openapi: 3.0.0
info:
  title: SmartSpender API
  version: 1.0.0
  description: API Documentation for SmartSpender Backend

servers:
  - url: http://localhost:5000/api
    description: Local server

tags:
  - name: Transactions
    description: Transaction CRUD APIs

paths:
  /transactions:
    get:
      tags:
        - Transactions
      summary: Get all transactions
      description: Retrieve transaction list of logged-in user with metadata and statistics
      responses:
        "200":
          description: Transaction list with metadata
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/TransactionResponse"
                  meta:
                    type: object
                    properties:
                      statistics:
                        type: object
                        properties:
                          totalIncome:
                            type: number
                            description: Total income of the user
                          totalExpense:
                            type: number
                            description: Total expense of the user
                          balance:
                            type: number
                            description: Balance (totalIncome - totalExpense)
        "401":
          description: Unauthorized

    post:
      tags:
        - Transactions
      summary: Create new transaction
      description: Add a new income or expense transaction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransactionInput"
            examples:
              example-1:
                value:
                  amount: 1000
                  type: "income"
                  category: "salary"
                  date: "2026-02-21"
                  note: "Monthly salary"
      responses:
        "201":
          description: Transaction created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionResponse"
        "400":
          description: Validation error
        "401":
          description: Unauthorized

  /transactions/{id}:
    get:
      tags:
        - Transactions
      summary: Get transaction detail
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          example: "123e4567-e89b-12d3-a456-426614174000"
      responses:
        "200":
          description: Transaction detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionResponse"
        "404":
          description: Not found
        "401":
          description: Unauthorized

    put:
      tags:
        - Transactions
      summary: Update transaction
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          example: "123e4567-e89b-12d3-a456-426614174000"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransactionInput"
            examples:
              example-1:
                value:
                  amount: 1500
                  type: "expense"
                  category: "travel"
                  date: "2026-02-22"
                  note: "Taxi fare"
      responses:
        "200":
          description: Transaction updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionResponse"
        "400":
          description: Validation error
        "404":
          description: Not found
        "401":
          description: Unauthorized

    delete:
      tags:
        - Transactions
      summary: Delete transaction
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          example: "123e4567-e89b-12d3-a456-426614174000"
      responses:
        "200":
          description: Transaction deleted successfully
        "404":
          description: Not found
        "401":
          description: Unauthorized

components:
  schemas:
    TransactionBase:
      type: object
      properties:
        amount:
          type: number
          minimum: 0
          maximum: 1000000000
          description: Amount of the transaction
        type:
          type: string
          enum:
            - income
            - expense
          description: Type of the transaction
        category:
          type: string
          enum:
            - food
            - travel
            - shopping
            - salary
            - entertainment
            - utility
            - other
          description: Category of the transaction
        date:
          type: string
          format: date
          description: Date of the transaction (YYYY-MM-DD)
        note:
          type: string
          maxLength: 200
          description: Additional notes for the transaction

    TransactionInput:
      allOf:
        - $ref: "#/components/schemas/TransactionBase"

    TransactionResponse:
      allOf:
        - $ref: "#/components/schemas/TransactionBase"
        - type: object
          properties:
            id:
              type: string
              format: uuid
              description: Unique identifier for the transaction
