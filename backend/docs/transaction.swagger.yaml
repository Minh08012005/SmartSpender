openapi: 3.0.0
info:
  title: SmartSpender API
  version: 1.0.0
  description: API Documentation for SmartSpender Backend

servers:
  - url: http://localhost:5000/api
    description: Local server

tags:
  - name: Transactions
    description: Transaction CRUD APIs

paths:
  /transactions:
    post:
      tags:
        - Transactions
      summary: Create new transaction
      description: Add a new income or expense transaction. All fields will be normalized/sanitized.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransactionInput"
            example:
              title: "Lunch at restaurant"
              amount: 150000
              type: "expense"
              category: "food"
              date: "2025-02-11"
              note: "With colleagues"
      responses:
        "201":
          description: Transaction created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionResponse"
              example:
                success: true
                statusCode: 201
                message: "Transaction created successfully"
                data:
                  _id: "65c88df8b2f8a1c21c23abcd"
                  userId: "65c87aa21b23bcd9999abcd1"
                  title: "Lunch at restaurant"
                  amount: 150000
                  type: "expense"
                  category: "food"
                  note: "With colleagues"
                  date: "2025-02-11"
                  createdAt: "2025-02-11T10:30:00.000Z"
                  updatedAt: "2025-02-11T10:30:00.000Z"
        "400":
          description: Validation error

    get:
      tags:
        - Transactions
      summary: Get all transactions
      description: Retrieve transaction list of logged in user
      responses:
        "200":
          description: Transaction list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Transaction"

  /transactions/{id}:
    get:
      tags:
        - Transactions
      summary: Get transaction detail
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Transaction detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"
        "404":
          description: Not found

    put:
      tags:
        - Transactions
      summary: Update transaction
      description: |
        Partially update a transaction. Only provide fields you want to change.
        - amount: accepts 0 or positive numbers
        - date: ISO format (YYYY-MM-DD)
        - category: must be valid category (lowercase)
        - type: either "income" or "expense"
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            description: Transaction ID (24-character hex string)
          example: 65c88df8b2f8a1c21c23abcd
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransactionUpdateInput"
            examples:
              updateTitle:
                summary: Update title only
                value:
                  title: "Updated Title"
              updateAmount:
                summary: Update amount only
                value:
                  amount: 75000
              updateMultiple:
                summary: Update multiple fields
                value:
                  title: "Dinner"
                  amount: 150000
                  category: "food"
                  type: "expense"
                  note: "Premium restaurant"
      responses:
        "200":
          description: Transaction updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionResponse"
              example:
                success: true
                statusCode: 200
                message: "Transaction updated successfully"
                data:
                  _id: "65c88df8b2f8a1c21c23abcd"
                  userId: "65c87aa21b23bcd9999abcd1"
                  title: "Dinner"
                  amount: 150000
                  type: "expense"
                  category: "food"
                  note: "Premium restaurant"
                  date: "2025-02-11"
                  createdAt: "2025-01-15T10:30:00.000Z"
                  updatedAt: "2025-02-11T14:20:00.000Z"
        "400":
          description: |
            Validation error. Possible reasons:
            - Invalid transaction ID format
            - Empty payload (no fields provided)
            - Invalid amount (negative)
            - Invalid date format
            - Invalid category
            - Invalid type (not 'income' or 'expense')
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  statusCode:
                    type: integer
                    example: 400
                  message:
                    type: string
                    example: "Validation failed"
        "401":
          description: Unauthorized - invalid or missing token
        "404":
          description: |
            Transaction not found or permission denied.
            User can only update their own transactions.

    delete:
      tags:
        - Transactions
      summary: Delete transaction
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted successfully

components:
  schemas:
    Transaction:
      type: object
      properties:
        _id:
          type: string
          example: "65c88df8b2f8a1c21c23abcd"
        userId:
          type: string
          example: "65c87aa21b23bcd9999abcd1"
        title:
          type: string
          example: "Lunch at restaurant"
        amount:
          type: number
          example: 150000
        type:
          type: string
          enum: [income, expense]
          example: "expense"
        category:
          type: string
          example: "food"
        note:
          type: string
          example: "With colleagues"
        date:
          type: string
          format: date
          example: "2025-02-11"
        createdAt:
          type: string
          format: date-time
          example: "2025-02-11T10:30:00.000Z"
        updatedAt:
          type: string
          format: date-time
          example: "2025-02-11T10:30:00.000Z"

    TransactionInput:
      type: object
      required:
        - title
        - amount
        - type
        - category
      properties:
        title:
          type: string
          minLength: 2
          maxLength: 100
          example: "Lunch"
        amount:
          type: number
          minimum: 0
          example: 50000
        type:
          type: string
          enum: [income, expense]
          example: "expense"
        category:
          type: string
          example: "food"
        note:
          type: string
          example: "Grab ride"
        date:
          type: string
          format: date
          example: "2025-02-11"

    TransactionUpdateInput:
      type: object
      description: "Partial update - provide only fields you want to change"
      properties:
        title:
          type: string
          minLength: 2
          maxLength: 100
          example: "Updated Title"
        amount:
          type: number
          minimum: 0
          description: "Amount, can be 0"
          example: 75000
        type:
          type: string
          enum: [income, expense]
          example: "expense"
        category:
          type: string
          description: "Category must be lowercase and valid"
          example: "food"
        note:
          type: string
          example: "Updated note"
        date:
          type: string
          format: date
          description: "ISO format date (YYYY-MM-DD)"
          example: "2025-02-11"

    TransactionResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: "#/components/schemas/Transaction"
