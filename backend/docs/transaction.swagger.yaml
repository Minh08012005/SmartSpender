openapi: 3.0.0
info:
  title: SmartSpender API
  version: 1.0.0
  description: API Documentation for SmartSpender Backend

servers:
  - url: http://localhost:5000/api
    description: Local server

tags:
  - name: Transactions
    description: Transaction CRUD APIs

paths:
  /transactions:
    post:
      tags:
        - Transactions
      summary: Create new transaction
      description: Add a new income or expense transaction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransactionInput"
      responses:
        "201":
          description: Transaction created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionResponse"
        "400":
          description: Validation error

    get:
      tags:
        - Transactions
      summary: Get all transactions
      description: Retrieve transaction list of logged in user
      responses:
        "200":
          description: Transaction list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Transaction"

  /transactions/{id}:
    get:
      tags:
        - Transactions
      summary: Get transaction detail
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Transaction detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"
        "404":
          description: Not found

    put:
      tags:
        - Transactions
      summary: Update transaction
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransactionInput"
      responses:
        "200":
          description: Updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionResponse"

    delete:
      tags:
        - Transactions
      summary: Delete transaction
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted successfully

components:
  schemas:
    Transaction:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier for the transaction
        amount:
          type: number
          description: Amount of the transaction
        category:
          type: string
          description: Category of the transaction
        date:
          type: string
          format: date
          description: Date of the transaction
        note:
          type: string
          description: Additional notes for the transaction

    TransactionInput:
      type: object
      properties:
        amount:
          type: number
          description: Amount of the transaction
        category:
          type: string
          description: Category of the transaction
        date:
          type: string
          format: date
          description: Date of the transaction
        note:
          type: string
          description: Additional notes for the transaction

    TransactionResponse:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier for the transaction
        amount:
          type: number
          description: Amount of the transaction
        category:
          type: string
          description: Category of the transaction
        date:
          type: string
          format: date
          description: Date of the transaction
        note:
          type: string
          description: Additional notes for the transaction
